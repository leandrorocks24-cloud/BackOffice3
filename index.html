      --badge-third-text: #0369A1;
      --badge-done-bg: #DCFCE7;

      --bg-surface: #141E2E;

      --badge-todo-text: #FDE68A;

      --badge-third-text: #BAE6FD;

      --badge-done-text: #A7F3D0;

    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .btn-action { padding: 6px 12px; font-size: 11.5px; font-weight: 600; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-main); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-action.primary { background: var(--tp-green); color: #fff; border: none; font-weight: 700; }
    .btn-action.primary:hover { opacity: 0.92; }

    /* Container Principal */
    .main-wrapper { max-width: 1400px; margin: 0 auto; padding: 18px 24px; }

    /* KPI Strip Compacto */

    .kpi-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; box-shadow: var(--card-shadow); }

    .kpi-value { font-size: 20px; font-weight: 800; color: var(--tp-green); margin-top: 2px; }
    .kpi-sub { font-size: 10.5px; color: var(--text-subtle); margin-top: 1px; }

    .filter-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    
    .filter-pills { display: flex; background: var(--bg-subtle); padding: 2px; border-radius: 6px; border: 1px solid var(--border); }

    .pill-btn.active { background: var(--bg-surface); color: var(--tp-green); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

       TABELA DE REGISTROS (ALTA DENSIDADE • SEM POLUIÇÃO)
       ========================================================================== */

    table.dense-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
    table.dense-table thead tr { background: var(--bg-subtle); border-bottom: 1px solid var(--border); }
    table.dense-table th { padding: 9px 12px; font-weight: 700; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; }
    table.dense-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    table.dense-table tbody tr { cursor: pointer; transition: background 0.1s; }
    table.dense-table tbody tr:hover { background: var(--bg-subtle); }
    table.dense-table tbody tr.selected { background: var(--tp-green-light); }

    .status-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; display: inline-flex; align-items: center; gap: 3px; }

    .st-todo { background: var(--badge-todo-bg); color: var(--badge-todo-text); }
    .st-done { background: var(--badge-done-bg); color: var(--badge-done-text); }
    .st-cancel { background: var(--bg-subtle); color: var(--text-muted); }

    .rt-normal { color: var(--text-muted); }

    .detail-cell-label { font-size: 10px; font-weight: 700; color: var(--text-subtle); text-transform: uppercase; }
    .detail-cell-val { font-weight: 600; color: var(--text-main); margin-top: 1px; word-break: break-word; }

    .timeline-item { border-left: 2px solid var(--border); padding-left: 10px; position: relative; font-size: 11.5px; }
    .timeline-item::before { content: ""; position: absolute; left: -5px; top: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--tp-green); }
    .timeline-item.internal::before { background: #F59E0B; }
    .timeline-time { font-size: 10px; color: var(--text-subtle); }
    .timeline-title { font-weight: 700; color: var(--text-main); }

    .field-input:focus, .field-select:focus { border-color: var(--border-focus); }

                  {/* Linha do Tempo Compacta */}
                  <div>
                    <div style={{fontSize:'11.5px', fontWeight:'700', color:'var(--text-main)', marginBottom:'6px'}}>
                      Histórico Operacional & Pareceres
                    </div>
                    <div className="timeline-list">
                      <div className="timeline-item">
                        <div className="timeline-time">{selectedTicket.startDate}</div>
                        <div className="timeline-title">Atendimento IP Finalizado</div>
                        <div className="timeline-desc">Demanda recebida e planilhada para acionamento externo.</div>
                      </div>
                      <div className="timeline-item internal">
                        <div className="timeline-time">{selectedTicket.startDate}</div>
                        <div className="timeline-title">Acionado {selectedTicket.terceiro}</div>
                        <div className="timeline-desc">Aguardando parecer técnico / laudo de rodovia.</div>
                      </div>
                      {selectedTicket.status === 'done' && (
                        <div className="timeline-item">
                          <div className="timeline-time">{selectedTicket.endDate || selectedTicket.returnDate}</div>
                          <div className="timeline-title">Retorno Prestado ao Cliente</div>
                          <div className="timeline-desc">Resolução comunicada ao cliente. Caso finalizado.</div>
                        </div>
                      )}
                    </div>
                  </div>

                </div>
              </div>
            </div>
          )}

          {/* =================================================================
              MODAL: NOVA DEMANDA / PLANILHAMENTO APÓS IP
              ================================================================= */}
          {isModalOpen && (
            <div className="modal-overlay" onClick={(e) => { if (e.target.className === 'modal-overlay') setIsModalOpen(false); }}>
              <div className="modal-card">
                <div className="modal-head">
                  <span style={{fontWeight:'700', color:'var(--tp-green)'}}>+ Planilhar Nova Demanda (Pós-Atendimento IP)</span>
                  <button onClick={() => setIsModalOpen(false)} style={{border:'none', background:'none', cursor:'pointer', fontSize:'15px', color:'var(--text-muted)'}}>✖</button>
                </div>

                <form className="modal-form" onSubmit={handleCreateRecord}>
                  <div className="form-col-full">
                    <label className="field-label">Cliente / Razão Social *</label>
                    <input className="field-input" type="text" name="client" required placeholder="Ex: Transportadora Silva" />
                  </div>

                  <div>
                    <label className="field-label">Telefone / Contato</label>
                    <input className="field-input" type="text" name="contact" placeholder="(00) 00000-0000" />
                  </div>

                  <div>
                    <label className="field-label">Operador Responsável</label>
                    <select className="field-select" name="operator">
                      <option value="Leandro">Leandro</option>
                      <option value="Mirian">Mirian</option>
                      <option value="Isabelli">Isabelli</option>
                    </select>
                  </div>

                  <div>
                    <label className="field-label">Produto *</label>
                    <select 
                      className="field-select" 
                      value={modalProduct} 
                      onChange={(e) => {
                        const p = e.target.value;
                        setModalProduct(p);
                        if (p === 'PEDÁGIO') setModalSolicitacao('Contestação');
                        else if (p === 'MANUTENÇÃO') setModalSolicitacao('Chamado T.I');
                        else setModalSolicitacao('Logistica');
                      }}
                    >
                      <option value="PEDÁGIO">Pedágio</option>
                      <option value="MANUTENÇÃO">Manutenção</option>
                      <option value="ABASTECIMENTO">Abastecimento</option>
                    </select>
                  </div>

                  <div>
                    <label className="field-label">Tipo de Solicitação *</label>
                    <select 
                      className="field-select"
                      value={modalSolicitacao}
                      onChange={(e) => setModalSolicitacao(e.target.value)}
                    >
                      {modalProduct === 'PEDÁGIO' && (
                        <>
                          <option value="Contestação">Contestação</option>
                          <option value="API MM">API MM</option>
                          <option value="Chamado T.I">Chamado T.I</option>
                          <option value="Pedidos">Pedidos</option>
                          <option value="Isenção">Isenção</option>
                          <option value="Outros">Outros</option>
                        </>
                      )}
                      {modalProduct === 'MANUTENÇÃO' && (
                        <>
                          <option value="Chamado T.I">Chamado T.I</option>
                          <option value="Layout XML">Layout XML</option>
                          <option value="Pedidos">Pedidos</option>
                          <option value="Orçamento">Orçamento</option>
                          <option value="Outros">Outros</option>
                        </>
                      )}
                      {modalProduct === 'ABASTECIMENTO' && (
                        <>
                          <option value="Logistica">Logistica</option>
                          <option value="Chamado T.I">Chamado T.I</option>
                          <option value="Isenção">Isenção</option>
                          <option value="Outros">Outros</option>
                        </>
                      )}
                    </select>
                  </div>

                  {/* OBRIGATÓRIO SE MANUTENÇÃO: CASA DAF */}
                  {modalProduct === 'MANUTENÇÃO' && (
                    <div className="form-col-full" style={{background:'var(--bg-subtle)', padding:'8px 10px', borderRadius:'6px', border:'1px solid var(--border)'}}>
                      <label className="field-label" style={{color:'var(--tp-green)'}}>🏢 Casa / Concessionária DAF * (Obrigatório para Manutenção)</label>
                      <select className="field-select" name="dafRede" required>
                        <option value="">Selecione a Casa DAF credenciada...</option>
                        {CONCESSIONARIAS_DAF.map(d => <option key={d} value={d}>{d}</option>)}
                      </select>
                    </div>
                  )}

                  {/* OBRIGATÓRIO SE CHAMADO T.I: LINK BITRIX */}
                  {modalSolicitacao === 'Chamado T.I' && (
                    <div className="form-col-full" style={{background:'#EEF2FF', padding:'8px 10px', borderRadius:'6px', border:'1px solid #C7D2FE'}}>
                      <label className="field-label" style={{color:'#4338CA'}}>🔗 Link Card Bitrix * (Obrigatório para Chamado T.I)</label>
                      <input className="field-input" type="url" name="bitrixLink" required placeholder="https://truckpag.bitrix24.com.br/workgroups/..." />
                    </div>
                  )}

                  <div className="form-col-full">
                    <label className="field-label">Terceiro / Setor Responsável pelo Parecer *</label>
                    <input className="field-input" type="text" name="terceiro" required placeholder="Ex: MoveMais / Concessionárias, TI Bitrix, Rede DAF..." />
                  </div>

                  {/* Calculadora de Data de Retorno */}
                  <div className="form-col-full" style={{background:'var(--tp-green-light)', padding:'10px', borderRadius:'6px', border:'1px solid var(--tp-green-border)'}}>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'4px'}}>
                      <label className="field-label" style={{color:'var(--tp-green)', margin:0}}>Data Prevista para Retorno ao Cliente *</label>
                      <button 
                        type="button" 
                        onClick={() => handleCalcReturnDate(modalSolicitacao)}
                        style={{background:'var(--tp-green)', color:'#fff', border:'none', borderRadius:'4px', padding:'3px 8px', fontSize:'10.5px', fontWeight:'700', cursor:'pointer'}}
                      >
                        ⚡ Calcular Prazo de Retorno
                      </button>
                    </div>
                    <input 
                      className="field-input" 
                      type="date" 
                      name="returnDate" 
                      required 
                      value={modalReturnDate} 
                      onChange={(e) => setModalReturnDate(e.target.value)} 
                    />
                    {calcFeedback && <div style={{fontSize:'10.5px', color:'var(--tp-green)', fontWeight:'600', marginTop:'4px'}}>{calcFeedback}</div>}
                  </div>

                  <div className="form-col-full">
                    <label className="field-label">Resumo do Problema / Ocorrência no IP</label>
                    <textarea className="field-textarea" name="desc" rows="2" placeholder="O que o cliente relatou e o que foi solicitado ao terceiro..."></textarea>
                  </div>

                  <div className="form-col-full" style={{display:'flex', justifyContent:'flex-end', gap:'8px', marginTop:'8px', paddingTop:'8px', borderTop:'1px solid var(--border)'}}>
                    <button type="button" className="btn-action" onClick={() => setIsModalOpen(false)}>Cancelar</button>
                    <button type="submit" className="btn-action primary">Salvar e Monitorar Demanda</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
