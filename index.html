      --border: #E2E8F0;
      --border-focus: #10B981;
      
      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-subtle: #94A3B8;

      --badge-todo-bg: #FEF3C7;
      --badge-todo-text: #92400E;
      --badge-process-bg: #E0F2FE;
      --badge-process-text: #0369A1;
      --badge-done-bg: #DCFCE7;
      --badge-done-text: #166534;
      --badge-danger-bg: #FEE2E2;
      --badge-danger-text: #991B1B;

      --note-bg: #FFFBEB;
      --note-border: #FDE68A;
      --note-text: #92400E;

      --card-shadow: 0 1px 3px rgba(0,0,0,0.03);
      --card-hover: 0 4px 10px rgba(0, 135, 68, 0.08);
    }

    body.dark-theme {
      --tp-green: #00A859;
      --tp-green-accent: #34D399;
      --tp-green-light: #064E3B;
      --tp-green-border: #047857;

      --bg-app: #0B111A;
      --bg-sidebar: #0F172A;
      --bg-surface: #141E2E;
      --bg-subtle: #1B273A;
      --border: #243447;
      --border-focus: #34D399;

      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --text-subtle: #64748B;

      --badge-todo-bg: #78350F;
      --badge-todo-text: #FDE68A;
      --badge-process-bg: #0C4A6E;
      --badge-process-text: #BAE6FD;
      --badge-done-bg: #064E3B;
      --badge-done-text: #A7F3D0;
      --badge-danger-bg: #7F1D1D;
      --badge-danger-text: #FECACA;

      --note-bg: #271A0C;
      --note-border: #78350F;
      --note-text: #FDE68A;

      --card-shadow: 0 2px 4px rgba(0,0,0,0.25);
      --card-hover: 0 4px 14px rgba(0, 168, 89, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-app); color: var(--text-main); font-size: 13px; line-height: 1.45; overflow: hidden; height: 100vh; }

    .app-container { display: flex; height: 100vh; width: 100vw; }

    /* ==========================================================================
       COLUNA 1: SIDEBAR / FILAS & VISÕES (~230px)
       ========================================================================== */
    .col-sidebar { width: 230px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; padding: 14px 10px; flex-shrink: 0; }
    
    .brand-box { display: flex; align-items: center; gap: 8px; padding: 0 6px 12px 6px; border-bottom: 1px solid var(--border); }
    .brand-logo { width: 30px; height: 30px; background: linear-gradient(135deg, var(--tp-green), var(--tp-green-accent)); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 13px; }
    .brand-info h1 { font-size: 13px; font-weight: 700; color: var(--tp-green); line-height: 1.1; }
    .brand-info p { font-size: 10px; color: var(--text-muted); }

    .btn-create { width: 100%; padding: 8px 12px; background: var(--tp-green); color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin: 12px 0 6px 0; }
    .btn-create:hover { opacity: 0.95; }

    .nav-section-title { font-size: 10px; font-weight: 700; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 8px 4px 8px; }
    .nav-list { display: flex; flex-direction: column; gap: 2px; }
    
    .nav-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 7px 10px; font-size: 12px; font-weight: 600; color: var(--text-muted); background: transparent; border: none; border-radius: 6px; cursor: pointer; text-align: left; }
    .nav-btn:hover { background: var(--bg-subtle); color: var(--text-main); }
    .nav-btn.active { background: var(--tp-green-light); color: var(--tp-green); font-weight: 700; }
    .nav-badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; background: var(--bg-subtle); color: var(--text-muted); }
    .nav-btn.active .nav-badge { background: var(--tp-green); color: #fff; }

    .sidebar-footer { border-top: 1px solid var(--border); padding-top: 10px; display: flex; align-items: center; justify-content: space-between; }
    .operator-profile { display: flex; align-items: center; gap: 8px; }
    .operator-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--tp-green); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; }
    .operator-name { font-size: 11px; font-weight: 600; }
    .theme-toggle-btn { background: var(--bg-subtle); border: 1px solid var(--border); color: var(--text-main); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; }

    /* ==========================================================================
       COLUNA 2: FILA DE DEMANDAS / RETORNOS (~380px)
       ========================================================================== */
    .col-tickets { width: 380px; background: var(--bg-app); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    
    .tickets-header { padding: 12px 14px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    
    /* Filtros Horizontais com Seletor de Mês */
    .tickets-filter-row { display: flex; gap: 6px; }
    .select-month { flex: 1; padding: 5px 8px; font-size: 11.5px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-main); font-weight: 600; outline: none; }
    .btn-export { padding: 5px 10px; font-size: 11px; font-weight: 600; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-main); cursor: pointer; white-space: nowrap; }

    .tickets-search-wrap { position: relative; width: 100%; }
    .tickets-search-wrap .search-icon { position: absolute; left: 8px; top: 6px; color: var(--text-subtle); font-size: 12px; }
    .tickets-search-input { width: 100%; padding: 5px 10px 5px 26px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-subtle); color: var(--text-main); outline: none; }
    .tickets-search-input:focus { border-color: var(--border-focus); background: var(--bg-surface); }

    .tickets-scroll-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }

    .ticket-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: all 0.15s; border-left: 3px solid transparent; }
    .ticket-card:hover { transform: translateY(-1px); box-shadow: var(--card-hover); border-color: var(--border-focus); }
    .ticket-card.selected { border-left-color: var(--tp-green); background: var(--bg-subtle); box-shadow: var(--card-shadow); }

    .ticket-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .ticket-id { font-size: 11px; font-weight: 700; color: var(--tp-green); font-family: monospace; }
    
    .ticket-alert { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-flex; align-items: center; gap: 3px; }
    .alert-today { background: var(--badge-todo-bg); color: var(--badge-todo-text); }
    .alert-late { background: var(--badge-danger-bg); color: var(--badge-danger-text); }
    .alert-normal { background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border); }
    .alert-done { background: var(--badge-done-bg); color: var(--badge-done-text); }

    .ticket-title { font-size: 12px; font-weight: 700; color: var(--text-main); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ticket-client { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }

    .ticket-tags { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .tag-pill { font-size: 9.5px; font-weight: 600; padding: 2px 5px; border-radius: 4px; background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border); }
    .tag-terceiro { color: #0284C7; background: #E0F2FE; border-color: #BAE6FD; font-weight: 700; }
    .tag-bitrix { color: #4F46E5; background: #EEF2FF; border-color: #C7D2FE; font-weight: 700; }

    /* ==========================================================================
       COLUNA 3: DETALHES & HISTÓRICO DE RETORNO (FLEX 1)
       ========================================================================== */
    .col-detail { flex: 1; background: var(--bg-surface); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .detail-topbar { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-sidebar); }
    .detail-title-group h2 { font-size: 14.5px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
    .detail-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .detail-actions { display: flex; align-items: center; gap: 8px; }
    .status-select, .op-select { font-size: 11.5px; font-weight: 600; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-main); cursor: pointer; outline: none; }

    /* Bloco Explicativo do Terceiro e Retorno */
    .metadata-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; padding: 10px 18px; background: var(--bg-subtle); border-bottom: 1px solid var(--border); font-size: 11.5px; }
    .meta-box { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
    .meta-label { font-size: 10px; font-weight: 700; color: var(--text-subtle); text-transform: uppercase; }
    .meta-value { font-weight: 600; color: var(--text-main); margin-top: 1px; }

    /* Linha do Tempo / Comunicação */
    .timeline-container { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }

    .message-row { display: flex; gap: 10px; max-width: 88%; }
    .message-row.client { align-self: flex-start; }
    .message-row.public { align-self: flex-end; flex-direction: row-reverse; }
    .message-row.internal { align-self: stretch; max-width: 100%; }

    .message-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .avatar-client { background: #E2E8F0; color: #475569; }
    .avatar-public { background: var(--tp-green); color: #fff; }
    .avatar-internal { background: #F59E0B; color: #fff; }

    .message-bubble { border-radius: 8px; padding: 9px 13px; font-size: 12px; line-height: 1.45; box-shadow: var(--card-shadow); border: 1px solid var(--border); }
    .message-row.client .message-bubble { background: var(--bg-subtle); border-color: var(--border); }
    .message-row.public .message-bubble { background: var(--tp-green-light); border-color: var(--tp-green-border); color: var(--text-main); }
    .message-row.internal .message-bubble { background: var(--note-bg); border-color: var(--note-border); color: var(--note-text); width: 100%; border-left: 3px solid #F59E0B; }

    .message-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; font-size: 10.5px; gap: 10px; }
    .message-sender { font-weight: 700; }
    .message-time { color: var(--text-subtle); font-size: 10px; }

    /* Compositor */
    .composer-area { padding: 10px 18px; border-top: 1px solid var(--border); background: var(--bg-sidebar); display: flex; flex-direction: column; gap: 8px; }
    
    .composer-tabs { display: flex; justify-content: space-between; align-items: center; }
    .tab-toggles { display: flex; gap: 4px; background: var(--bg-subtle); padding: 2px; border-radius: 6px; }
    .toggle-btn { font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 4px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; }
    .toggle-btn.active.public { background: var(--bg-surface); color: var(--tp-green); font-weight: 700; box-shadow: var(--card-shadow); }
    .toggle-btn.active.internal { background: #FEF3C7; color: #92400E; font-weight: 700; box-shadow: var(--card-shadow); }

    .macro-chip { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: var(--bg-subtle); border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; }

    .composer-input-row { display: flex; gap: 8px; align-items: flex-end; }
    .composer-textarea { flex: 1; resize: none; height: 58px; padding: 8px 10px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-main); outline: none; }
    .composer-textarea.internal-mode { background: var(--note-bg); border-color: var(--note-border); }

    .btn-send { height: 58px; padding: 0 16px; font-size: 11.5px; font-weight: 700; border-radius: 6px; border: none; cursor: pointer; }
    .btn-send.public { background: var(--tp-green); color: #fff; }
    .btn-send.internal { background: #D97706; color: #fff; }

    /* Modal Nova Demanda */
    .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(2px); }
    .modal-content { background: var(--bg-surface); width: 95%; max-width: 580px; padding: 20px; border-radius: 10px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); border: 1px solid var(--border); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .modal-header h2 { font-size: 14.5px; color: var(--tp-green); font-weight: 700; }
    
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
    .form-group.full { grid-column: span 2; }
    .form-group label { font-size: 11px; font-weight: 700; color: var(--text-main); }
    .form-group input, .form-group select, .form-group textarea { font-size: 12px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-main); outline: none; }
  </style>
</head>

            time: "06/08/2026 10:58",
            text: "Esclarecido junto ao posto com envio da carta de conciliação."
          }
        ]
      },
      {
        id: "REC-015",
        mes: "07-2026",
        title: "Ausência de Registro de VPO - Integração API MM",
        client: "Mares do Sul",
        contact: "(48) 99903-4132",
        operator: "Leandro",
        product: "PEDÁGIO",
        solicitacao: "Chamado T.I",
        terceiro: "TI TruckPag / MoveMais",
        protocolo: "Bitrix #3801",
        bitrixLink: "https://truckpag.bitrix24.com.br/workgroups/group/12/tasks/task/view/3801/",
        slaTerceiro: "Concluído",
        status: "done",
        priority: "Alta",
        startDate: "30/07/2026 10:47",
        returnDate: "14/08/2026",
        messages: [
          {
            id: 1,
            type: "client",
            sender: "Mares do Sul",
            time: "30/07/2026 10:47",
            text: "Veículos passando sem validação automática de Vale Pedágio Obrigatório (VPO)."
          },
          {
            id: 2,
            type: "internal",
            sender: "Leandro Silveira (Nota Interna)",
            time: "02/08/2026 14:00",
            text: "🔒 Chamado TI aberto no Bitrix #3801 para ajuste de endpoint na API da MoveMais."
          },
          {
            id: 3,
            type: "public",
            sender: "Leandro Silveira (Retorno)",
            time: "14/08/2026 16:20",
            text: "Integração restabelecida e homologada junto à transportadora."
          }
        ]
      }
    ];

    function App() {
      const [tickets, setTickets] = useState(() => {
        try {
          const stored = localStorage.getItem("tp_tickets_v11");
          return stored ? JSON.parse(stored) : INITIAL_TICKETS;
        } catch(e) {
          return INITIAL_TICKETS;
        }
      });

      const [selectedId, setSelectedId] = useState("REC-139");
      const [filterView, setFilterView] = useState("all");
      const [filterMonth, setFilterMonth] = useState("");
      const [searchQuery, setSearchQuery] = useState("");
      const [composerType, setComposerType] = useState("public"); // "public" | "internal"
      const [composerText, setComposerText] = useState("");
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [theme, setTheme] = useState(localStorage.getItem("tp_theme_v11") || "light");

      useEffect(() => {
        if (theme === "dark") {
          document.body.classList.add("dark-theme");
        } else {
          document.body.classList.remove("dark-theme");
        }
        localStorage.setItem("tp_theme_v11", theme);
      }, [theme]);

      const saveTicketsState = (updated) => {
        setTickets(updated);
        try { localStorage.setItem("tp_tickets_v11", JSON.stringify(updated)); } catch(e){}
      };

      const toggleTheme = () => setTheme(theme === "dark" ? "light" : "dark");

      // Ticket Ativo
      const activeTicket = tickets.find(t => t.id === selectedId) || tickets[0];

      // Filtros
      const filteredTickets = tickets.filter(t => {
        if (filterView === "mine" && t.operator !== "Leandro") return false;
        if (filterView === "waiting_third" && t.status !== "in_progress") return false;
        if (filterView === "open" && t.status !== "todo") return false;
        if (filterView === "done" && t.status !== "done") return false;
        if (filterView === "pedagio" && t.product !== "PEDÁGIO") return false;
        if (filterView === "abastecimento" && t.product !== "ABASTECIMENTO") return false;
        if (filterView === "manutencao" && t.product !== "MANUTENÇÃO") return false;

        if (filterMonth && t.mes !== filterMonth) return false;

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const match = (t.id + " " + t.title + " " + t.client + " " + (t.terceiro || "") + " " + (t.protocolo || "")).toLowerCase();
          if (!match.includes(q)) return false;
        }

        return true;
      });

      // Status do Retorno (Hoje, Atrasado, No Prazo)
      const getReturnAlert = (t) => {
        if (t.status === "done") return { label: "✓ Finalizado", class: "alert-done" };
        if (!t.returnDate) return { label: "Sem Prazo", class: "alert-normal" };
        
        const [dia, mes, ano] = t.returnDate.split("/");
        const target = new Date(ano, mes - 1, dia);
        target.setHours(0,0,0,0);
        
        const now = new Date();
        now.setHours(0,0,0,0);

        if (target < now) return { label: "🚨 Retorno Atrasado", class: "alert-late" };
        if (target.getTime() === now.getTime()) return { label: "⏰ Retornar Hoje", class: "alert-today" };
        return { label: `📅 Retorno: ${t.returnDate}`, class: "alert-normal" };
      };

      // Enviar mensagem/nota
      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!composerText.trim()) return;

        const now = new Date();
        const d = String(now.getDate()).padStart(2, '0');
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const y = now.getFullYear();
        const h = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const timeFormatted = `${d}/${m}/${y} ${h}:${min}`;

        const newMessage = {
          id: Date.now(),
          type: composerType,
          sender: composerType === "internal" ? "Leandro (Nota Interna / Terceiro)" : "Leandro (Aviso ao Cliente)",
          time: timeFormatted,
          text: composerType === "internal" ? `🔒 ${composerText.trim()}` : composerText.trim()
        };

        const updated = tickets.map(t => {
          if (t.id === activeTicket.id) {
            return { ...t, messages: [...t.messages, newMessage] };
          }
          return t;
        });

        saveTicketsState(updated);
        setComposerText("");
      };

      // Alterar status
      const handleStatusChange = (newStatus) => {
        const updated = tickets.map(t => {
          if (t.id === activeTicket.id) return { ...t, status: newStatus };
          return t;
        });
        saveTicketsState(updated);
      };

      // Salvar nova demanda via Modal
      const handleCreateTicket = (e) => {
        e.preventDefault();
        const form = e.target;
        
        const now = new Date();
        const d = String(now.getDate()).padStart(2, '0');
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const y = now.getFullYear();
        const h = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');

        const rawReturn = form.returnDate.value; // YYYY-MM-DD
        const [rAno, rMes, rDia] = rawReturn ? rawReturn.split('-') : ['', '', ''];
        const formattedReturn = rawReturn ? `${rDia}/${rMes}/${rAno}` : '';

        const newRec = {
          id: `REC-${Date.now().toString().slice(-3)}`,
          mes: `${m}-${y}`,
          title: form.title.value,
          client: form.client.value,
          contact: form.contact.value,
          operator: form.operator.value,
          product: form.product.value,
          solicitacao: form.solicitacao.value,
          terceiro: form.terceiro.value,
          protocolo: form.protocolo.value,
          bitrixLink: form.bitrixLink.value || '',
          slaTerceiro: form.slaTerceiro.value || 'Em análise',
          status: "in_progress", // Já nasce aguardando terceiro
          priority: form.priority.value,
          startDate: `${d}/${m}/${y} ${h}:${min}`,
          returnDate: formattedReturn,
          messages: [
            {
              id: 1,
              type: "client",
              sender: "Atendimento IP (Fechado)",
              time: `${d}/${m}/${y} ${h}:${min}`,
              text: form.desc.value || "Demanda recebida no atendimento IP e registrada para acompanhamento externo."
            },
            {
              id: 2,
              type: "internal",
              sender: `${form.operator.value} (Acionamento Terceiro)`,
              time: `${d}/${m}/${y} ${h}:${min}`,
              text: `🔒 Acionado ${form.terceiro.value}. Protocolo/Ref: ${form.protocolo.value}.`
            }
          ]
        };

        saveTicketsState([newRec, ...tickets]);
        setSelectedId(newRec.id);
        setIsModalOpen(false);
      };

      // Exportar Excel BR
      const exportExcel = () => {
        const headers = ['ID', 'Mês', 'Responsável', 'Produto', 'Cliente', 'Contato', 'Solicitação', 'Terceiro Acionado', 'Protocolo/Ref', 'SLA Terceiro', 'Status', 'Data Início', 'Data Retorno'];
        const rows = [headers.join(';')];
        filteredTickets.forEach(t => {
          rows.push([
            t.id,
            t.mes,
            t.operator,
            t.product,
            `"${t.client}"`,
            `"${t.contact}"`,
            `"${t.solicitacao}"`,
            `"${t.terceiro}"`,
            `"${t.protocolo}"`,
            `"${t.slaTerceiro}"`,
            t.status,
            t.startDate,
            t.returnDate
          ].join(';'));
        });
        const blob = new Blob(["\uFEFF" + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `FollowUp_BackOffice_TruckPag_${new Date().toLocaleDateString('pt-BR').replace(/\//g, '-')}.csv`;
        a.click();
      };

      return (
        <div className="app-container">
          
          {/* =================================================================
              COLUNA 1: SIDEBAR (FILAS DE RETORNO & TERCEIROS)
              ================================================================= */}
          <aside className="col-sidebar">
            <div>
              <div className="brand-box">
                <div className="brand-logo">TP</div>
                <div className="brand-info">
                  <h1>TruckPag</h1>
                  <p>Follow-up & Terceiros</p>
                </div>
              </div>

              <button className="btn-create" onClick={() => setIsModalOpen(true)}>
                + Nova Demanda / Terceiro
              </button>

              <div className="nav-section-title">Controle de Retornos</div>
              <div className="nav-list">
                <button className={`nav-btn ${filterView === 'all' ? 'active' : ''}`} onClick={() => setFilterView('all')}>
                  <span>📥 Todas as Demandas</span>
                  <span className="nav-badge">{tickets.length}</span>
                </button>
                <button className={`nav-btn ${filterView === 'waiting_third' ? 'active' : ''}`} onClick={() => setFilterView('waiting_third')}>
                  <span>⏳ Aguardando Terceiro</span>
                  <span className="nav-badge" style={{color:'#0284C7', fontWeight:'700'}}>
                    {tickets.filter(t => t.status === 'in_progress').length}
                  </span>
                </button>
                <button className={`nav-btn ${filterView === 'mine' ? 'active' : ''}`} onClick={() => setFilterView('mine')}>
                  <span>👤 Meus Atendimentos</span>
                  <span className="nav-badge">{tickets.filter(t => t.operator === 'Leandro').length}</span>
                </button>
                <button className={`nav-btn ${filterView === 'done' ? 'active' : ''}`} onClick={() => setFilterView('done')}>
                  <span>✅ Retornos Finalizados</span>
                  <span className="nav-badge">{tickets.filter(t => t.status === 'done').length}</span>
                </button>
              </div>

              <div className="nav-section-title">Por Produto / Serviço</div>
              <div className="nav-list">
                <button className={`nav-btn ${filterView === 'pedagio' ? 'active' : ''}`} onClick={() => setFilterView('pedagio')}>
                  <span>🛣️ Pedágio (MoveMais)</span>
                  <span className="nav-badge">{tickets.filter(t => t.product === 'PEDÁGIO').length}</span>
                </button>
                <button className={`nav-btn ${filterView === 'abastecimento' ? 'active' : ''}`} onClick={() => setFilterView('abastecimento')}>
                  <span>⛽ Abastecimento</span>
                  <span className="nav-badge">{tickets.filter(t => t.product === 'ABASTECIMENTO').length}</span>
                </button>
                <button className={`nav-btn ${filterView === 'manutencao' ? 'active' : ''}`} onClick={() => setFilterView('manutencao')}>
                  <span>🔧 Manutenção DAF</span>
                  <span className="nav-badge">{tickets.filter(t => t.product === 'MANUTENÇÃO').length}</span>
                </button>
              </div>
            </div>

            <div className="sidebar-footer">
              <div className="operator-profile">
                <div className="operator-avatar">L</div>
                <div>
                  <div className="operator-name">Leandro Silveira</div>
                  <div style={{fontSize:'10px', color:'var(--tp-green)', fontWeight:'700'}}>● BackOffice Ativo</div>
                </div>
              </div>
              <button className="theme-toggle-btn" onClick={toggleTheme} title="Alternar Modo Escuro / Claro">
                {theme === 'dark' ? '☀️' : '🌙'}
              </button>
            </div>
          </aside>

          {/* =================================================================
              COLUNA 2: FILA DE DEMANDAS COM FILTRO MENSAL
              ================================================================= */}
          <section className="col-tickets">
            <div className="tickets-header">
              {/* Filtro Mensal e Exportação */}
              <div className="tickets-filter-row">
                <select 
                  className="select-month"
                  value={filterMonth}
                  onChange={(e) => setFilterMonth(e.target.value)}
                >
                  <option value="">📅 Todos os Meses</option>
                  <option value="11-2026">Novembro / 2026</option>
                  <option value="10-2026">Outubro / 2026</option>
                  <option value="09-2026">Setembro / 2026</option>
                  <option value="08-2026">Agosto / 2026</option>
                  <option value="07-2026">Julho / 2026</option>
                </select>
                <button className="btn-export" onClick={exportExcel} title="Exportar dados filtrados">
                  📤 Excel
                </button>
              </div>

              {/* Barra de Busca */}
              <div className="tickets-search-wrap">
                <span className="search-icon">🔍</span>
                <input 
                  type="text" 
                  className="tickets-search-input" 
                  placeholder="Buscar cliente, terceiro, protocolo..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                />
              </div>
            </div>

            {/* Lista dos Cards de Demandas */}
            <div className="tickets-scroll-list">
              {filteredTickets.map(t => {
                const isSelected = t.id === activeTicket.id;
                const alertInfo = getReturnAlert(t);

                return (
                  <div 
                    key={t.id} 
                    className={`ticket-card ${isSelected ? 'selected' : ''}`}
                    onClick={() => setSelectedId(t.id)}
                  >
                    <div className="ticket-card-top">
                      <span className="ticket-id">{t.id}</span>
                      <span className={`ticket-alert ${alertInfo.class}`}>
                        {alertInfo.label}
                      </span>
                    </div>

                    <div className="ticket-title" title={t.title}>{t.title}</div>
                    <div className="ticket-client">🏢 {t.client}</div>

                    <div className="ticket-tags">
                      <span className="tag-pill tag-terceiro">⚙️ {t.terceiro}</span>
                      <span className="tag-pill">{t.product}</span>
                      {t.bitrixLink && <span className="tag-pill tag-bitrix">🔗 Bitrix</span>}
                      <span style={{marginLeft:'auto', fontSize:'10px', color:'var(--text-subtle)'}}>👤 {t.operator}</span>
                    </div>
                  </div>
                );
              })}

              {filteredTickets.length === 0 && (
                <div style={{textAlign:'center', padding:'40px 10px', color:'var(--text-muted)'}}>
                  Nenhuma demanda encontrada no filtro selecionado.
                </div>
              )}
            </div>
          </section>

          {/* =================================================================
              COLUNA 3: DETALHES, SLA DE TERCEIROS & LINHA DO TEMPO
              ================================================================= */}
          <main className="col-detail">
            {/* Topbar com ID, Título e Ação de Fechamento */}
            <div className="detail-topbar">
              <div className="detail-title-group">
                <h2>
                  <span style={{color:'var(--tp-green)', fontFamily:'monospace'}}>{activeTicket.id}</span>
                  <span>{activeTicket.title}</span>
                </h2>
                <div className="detail-subtitle">
                  Cliente: <strong>{activeTicket.client}</strong> • Registrado em: {activeTicket.startDate}
                </div>
              </div>

              <div className="detail-actions">
                <select 
                  className="status-select"
                  value={activeTicket.status}
                  onChange={(e) => handleStatusChange(e.target.value)}
                >
                  <option value="in_progress">⏳ Aguardando Terceiro</option>
                  <option value="todo">⏰ Retorno Pendente</option>
                  <option value="done">✅ Retorno Realizado / Concluído</option>
                </select>

                <select 
                  className="op-select"
                  value={activeTicket.operator}
                  onChange={(e) => {
                    const updated = tickets.map(t => t.id === activeTicket.id ? { ...t, operator: e.target.value } : t);
                    saveTicketsState(updated);
                  }}
                >
                  <option value="Leandro">👤 Leandro</option>
                  <option value="Mirian">👤 Mirian</option>
                  <option value="Isabelli">👤 Isabelli</option>
                </select>
              </div>
            </div>

            {/* Strip de Informações Claras sobre o Terceiro e Retorno */}
            <div className="metadata-strip">
              <div className="meta-box">
                <div className="meta-label">Terceiro / Setor Acionado</div>
                <div className="meta-value" style={{color:'#0284C7'}}>⚙️ {activeTicket.terceiro}</div>
              </div>

              <div className="meta-box">
                <div className="meta-label">Protocolo / Ref. Externa</div>
                <div className="meta-value">
                  {activeTicket.bitrixLink ? (
                    <a href={activeTicket.bitrixLink} target="_blank" rel="noreferrer" style={{color:'#4F46E5', textDecoration:'none', fontWeight:'700'}}>
                      {activeTicket.protocolo || 'Abrir Card Bitrix ↗'}
                    </a>
                  ) : (
                    activeTicket.protocolo || 'Não informado'
                  )}
                </div>
              </div>

              <div className="meta-box">
                <div className="meta-label">Estimativa SLA do Terceiro</div>
                <div className="meta-value">{activeTicket.slaTerceiro || 'Em análise'}</div>
              </div>

              <div className="meta-box">
                <div className="meta-label">Data Agendada para Retorno</div>
                <div className="meta-value" style={{color:'var(--tp-green)'}}>
                  📅 {activeTicket.returnDate || 'A definir'}
                </div>
              </div>

              <div className="meta-box">
                <div className="meta-label">Contato do Cliente</div>
                <div className="meta-value">📞 {activeTicket.contact || 'Sem telefone'}</div>
              </div>
            </div>

            {/* Linha do Tempo: Histórico de Contatos e Terceiros */}
            <div className="timeline-container">
              {activeTicket.messages.map(msg => (
                <div key={msg.id} className={`message-row ${msg.type}`}>
                  <div className={`message-avatar ${msg.type === 'client' ? 'avatar-client' : (msg.type === 'public' ? 'avatar-public' : 'avatar-internal')}`}>
                    {msg.type === 'client' ? 'IP' : (msg.type === 'public' ? 'TP' : '🔒')}
                  </div>

                  <div className="message-bubble">
                    <div className="message-header">
                      <span className="message-sender">{msg.sender}</span>
                      <span className="message-time">{msg.time}</span>
                    </div>
                    <div>{msg.text}</div>
                  </div>
                </div>
              ))}
            </div>

            {/* Compositor: Registrar Resposta do Terceiro ou Retorno ao Cliente */}
            <form className="composer-area" onSubmit={handleSendMessage}>
              <div className="composer-tabs">
                <div className="tab-toggles">
                  <button 
                    type="button" 
                    className={`toggle-btn ${composerType === 'public' ? 'active public' : ''}`}
                    onClick={() => setComposerType('public')}
                  >
                    📞 Retorno ao Cliente (Aviso / Conclusão)
                  </button>
                  <button 
                    type="button" 
                    className={`toggle-btn ${composerType === 'internal' ? 'active internal' : ''}`}
                    onClick={() => setComposerType('internal')}
                  >
                    🔒 Resposta do Terceiro / Nota de BackOffice
                  </button>
                </div>

                <div style={{display:'flex', gap:'4px', alignItems:'center'}}>
                  <span style={{fontSize:'10px', color:'var(--text-subtle)'}}>Textos Rápidos:</span>
                  <button 
                    type="button" 
                    className="macro-chip"
                    onClick={() => setComposerText("Avisado cliente via WhatsApp que a contestação foi formalizada com a operadora. Aguardando laudo.")}
                  >
                    + Protocolo Informado
                  </button>
                  <button 
                    type="button" 
                    className="macro-chip"
                    onClick={() => setComposerText("Terceiro respondeu deferindo a solicitação. Realizado contato telefônico com o cliente prestando o fechamento.")}
                  >
                    + Retorno Realizado
                  </button>
                </div>
              </div>

              <div className="composer-input-row">
                <textarea 
                  className={`composer-textarea ${composerType === 'internal' ? 'internal-mode' : ''}`}
                  placeholder={composerType === 'public' ? "Registrar retorno oficial dado ao cliente (ligação, WhatsApp, e-mail)..." : "Registrar resposta do terceiro (e-mail MoveMais, retorno da concessionária, atualização de TI no Bitrix)..."}
                  value={composerText}
                  onChange={(e) => setComposerText(e.target.value)}
                ></textarea>

                <button 
                  type="submit" 
                  className={`btn-send ${composerType === 'public' ? 'public' : 'internal'}`}
                >
                  <span>{composerType === 'public' ? 'Registrar' : 'Salvar'}</span>
                  <span style={{fontSize:'9px', fontWeight:'normal'}}>{composerType === 'public' ? 'Cliente' : 'Terceiro'}</span>
                </button>
              </div>
            </form>
          </main>

          {/* =================================================================
              MODAL: CADASTRAR NOVA DEMANDA / ACIONAMENTO DE TERCEIRO
              ================================================================= */}
          {isModalOpen && (
            <div className="modal" style={{display:'flex'}} onClick={(e) => { if(e.target.className === 'modal') setIsModalOpen(false); }}>
              <div className="modal-content">
                <div className="modal-header">
                  <h2>+ Nova Demanda BackOffice (Acionamento de Terceiro)</h2>
                  <button onClick={() => setIsModalOpen(false)} style={{border:'none', background:'none', cursor:'pointer', fontSize:'16px'}}>✖</button>
                </div>

                <form onSubmit={handleCreateTicket}>
                  <div className="form-grid">
                    <div className="form-group full">
                      <label>Assunto / Resumo da Demanda</label>
                      <input type="text" name="title" required placeholder="Ex: Contestação Free Flow / Erro Layout DealerNet" />
                    </div>

                    <div className="form-group">
                      <label>Cliente / Transportadora</label>
                      <input type="text" name="client" required placeholder="Nome do cliente atendido no IP" />
                    </div>

                    <div className="form-group">
                      <label>Telefone / Contato</label>
                      <input type="text" name="contact" required placeholder="(00) 00000-0000" />
                    </div>

                    <div className="form-group">
                      <label>Produto</label>
                      <select name="product" required>
                        <option value="PEDÁGIO">Pedágio</option>
                        <option value="ABASTECIMENTO">Abastecimento</option>
                        <option value="MANUTENÇÃO">Manutenção DAF</option>
                      </select>
                    </div>

                    <div className="form-group">
                      <label>Tipo de Solicitação</label>
                      <select name="solicitacao" required>
                        <option value="Contestação">Contestação</option>
                        <option value="Chamado T.I">Chamado T.I</option>
                        <option value="Layout XML">Layout XML</option>
                        <option value="Logistica">Logística</option>
                        <option value="Outros">Outros</option>
                      </select>
                    </div>

                    <div className="form-group">
                      <label>Terceiro / Setor Acionado</label>
                      <input type="text" name="terceiro" required placeholder="Ex: MoveMais, TI Bitrix, Concessionária DAF..." />
                    </div>

                    <div className="form-group">
                      <label>Protocolo / Ref. Externa</label>
                      <input type="text" name="protocolo" placeholder="Ex: Protocolo 12345 ou Bitrix #4500" />
                    </div>

                    <div className="form-group full">
                      <label>Link Card Bitrix (Se houver chamado de T.I)</label>
                      <input type="url" name="bitrixLink" placeholder="https://truckpag.bitrix24.com.br/..." />
                    </div>

                    <div className="form-group">
                      <label>Estimativa SLA do Terceiro</label>
                      <input type="text" name="slaTerceiro" placeholder="Ex: 15 dias úteis, 48h..." />
                    </div>

                    <div className="form-group">
                      <label>Data Agendada para Retorno ao Cliente</label>
                      <input type="date" name="returnDate" required />
                    </div>

                    <div className="form-group">
                      <label>Operador Responsável</label>
                      <select name="operator">
                        <option value="Leandro">Leandro</option>
                        <option value="Mirian">Mirian</option>
                        <option value="Isabelli">Isabelli</option>
                      </select>
                    </div>

                    <div className="form-group">
                      <label>Prioridade</label>
                      <select name="priority">
                        <option value="Média">Média</option>
                        <option value="Alta">Alta</option>
                        <option value="Crítica">Crítica</option>
                      </select>
                    </div>

                    <div className="form-group full">
                      <label>Detalhes do Atendimento IP / O que foi solicitado ao terceiro</label>
                      <textarea name="desc" rows="3" placeholder="Resumo do problema do cliente e o que foi formalizado com o terceiro..."></textarea>
                    </div>
                  </div>

                  <div style={{display:'flex', justifyContent:'flex-end', gap:'8px', marginTop:'14px', paddingTop:'10px', borderTop:'1px solid var(--border)'}}>
                    <button type="button" className="btn-export" onClick={() => setIsModalOpen(false)}>Cancelar</button>
                    <button type="submit" className="btn-create" style={{width:'auto', margin:0, padding:'6px 16px'}}>Salvar e Planilhar Demanda</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
