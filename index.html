       ========================================================================== */

      --tp-green: #008744;

      --tp-green-border: #A7F3D0;

      --bg-sidebar: #FFFFFF;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F1F5F9;
      --border: #E2E8F0;
      --border-focus: #10B981;
      
      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-subtle: #94A3B8;

      --badge-todo-bg: #FEF3C7;
      --badge-todo-text: #92400E;
      --badge-process-bg: #E0F2FE;
      --badge-process-text: #0369A1;
      --badge-done-bg: #DCFCE7;
      --badge-done-text: #166534;
      --badge-danger-bg: #FEE2E2;
      --badge-danger-text: #991B1B;

      --note-bg: #FFFBEB;
      --note-border: #FDE68A;
      --note-text: #92400E;

      --card-shadow: 0 1px 3px rgba(0,0,0,0.04);
      --card-hover: 0 4px 12px rgba(0, 135, 68, 0.08);
    }

    body.dark-theme {
      --tp-green: #00A859;
      --tp-green-accent: #34D399;
      --tp-green-light: #064E3B;
      --tp-green-border: #047857;

      --bg-app: #0B111A;
      --bg-sidebar: #0F172A;
      --bg-surface: #141E2E;
      --bg-subtle: #1B273A;
      --border: #243447;
      --border-focus: #34D399;

      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --text-subtle: #64748B;

      --badge-todo-bg: #78350F;
      --badge-todo-text: #FDE68A;
      --badge-process-bg: #0C4A6E;
      --badge-process-text: #BAE6FD;
      --badge-done-bg: #064E3B;
      --badge-done-text: #A7F3D0;
      --badge-danger-bg: #7F1D1D;
      --badge-danger-text: #FECACA;

      --note-bg: #271A0C;
      --note-border: #78350F;
      --note-text: #FDE68A;

      --card-hover: 0 4px 16px rgba(0, 168, 89, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-app); color: var(--text-main); font-size: 13px; line-height: 1.45; overflow: hidden; height: 100vh; }

    /* Layout Geral de 3 Colunas */
    .app-container { display: flex; height: 100vh; width: 100vw; }

    /* ==========================================================================
       COLUNA 1: SIDEBAR / FILAS & VISÕES (~230px)
       ========================================================================== */
    .col-sidebar { width: 230px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; padding: 14px 10px; flex-shrink: 0; }
    
    .brand-box { display: flex; align-items: center; gap: 8px; padding: 0 6px 12px 6px; border-bottom: 1px solid var(--border); }
    .brand-logo { width: 30px; height: 30px; background: linear-gradient(135deg, var(--tp-green), var(--tp-green-accent)); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 13px; }
    .brand-info h1 { font-size: 13px; font-weight: 700; color: var(--tp-green); line-height: 1.1; }
    .brand-info p { font-size: 10px; color: var(--text-muted); }

    .nav-section-title { font-size: 10px; font-weight: 700; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.5px; padding: 12px 8px 4px 8px; }
    .nav-list { display: flex; flex-direction: column; gap: 2px; }
    
    .nav-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 7px 10px; font-size: 12px; font-weight: 600; color: var(--text-muted); background: transparent; border: none; border-radius: 6px; cursor: pointer; text-align: left; transition: all 0.15s; }
    .nav-btn:hover { background: var(--bg-subtle); color: var(--text-main); }
    .nav-btn.active { background: var(--tp-green-light); color: var(--tp-green); font-weight: 700; }
    .nav-badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; background: var(--bg-subtle); color: var(--text-muted); }
    .nav-btn.active .nav-badge { background: var(--tp-green); color: #fff; }

    .sidebar-footer { border-top: 1px solid var(--border); padding-top: 10px; display: flex; align-items: center; justify-content: space-between; }
    .operator-profile { display: flex; align-items: center; gap: 8px; }
    .operator-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--tp-green); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; }
    .operator-name { font-size: 11px; font-weight: 600; }
    .theme-toggle-btn { background: var(--bg-subtle); border: 1px solid var(--border); color: var(--text-main); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; }

    /* ==========================================================================
       COLUNA 2: LISTA DE TICKETS (~370px)
       ========================================================================== */

    .tickets-header { padding: 12px 14px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .tickets-search-wrap { position: relative; width: 100%; }
    .tickets-search-wrap .search-icon { position: absolute; left: 8px; top: 7px; color: var(--text-subtle); font-size: 12px; }
    .tickets-search-input { width: 100%; padding: 6px 10px 6px 26px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-subtle); color: var(--text-main); outline: none; }
    .tickets-search-input:focus { border-color: var(--border-focus); background: var(--bg-surface); }
    
    .tickets-meta-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-muted); font-weight: 600; }

    .tickets-scroll-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }

    .ticket-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: all 0.15s; border-left: 3px solid transparent; }
    .ticket-card:hover { transform: translateY(-1px); box-shadow: var(--card-hover); border-color: var(--border-focus); }
    .ticket-card.selected { border-left-color: var(--tp-green); background: var(--bg-subtle); box-shadow: var(--card-shadow); }

    .ticket-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .ticket-id { font-size: 11px; font-weight: 700; color: var(--tp-green); font-family: monospace; }
    .ticket-sla { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-flex; align-items: center; gap: 3px; }
    .sla-urgent { background: var(--badge-danger-bg); color: var(--badge-danger-text); }
    .sla-normal { background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border); }
    .sla-done { background: var(--badge-done-bg); color: var(--badge-done-text); }

    .ticket-title { font-size: 12.5px; font-weight: 700; color: var(--text-main); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ticket-client { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }

    .ticket-tags { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .tag-pill { font-size: 9.5px; font-weight: 600; padding: 2px 5px; border-radius: 4px; background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border); }

       COLUNA 3: DETALHES & LINHA DO TEMPO / CHAT (FLEX 1)
       ========================================================================== */

    .detail-topbar { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-sidebar); }

    .detail-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .detail-actions { display: flex; align-items: center; gap: 8px; }

    /* Barra de Metadados Horizontal */

    .meta-item { display: flex; align-items: center; gap: 4px; color: var(--text-muted); }
    .meta-item strong { color: var(--text-main); font-weight: 600; }

    /* Linha do Tempo / Mensagens */

    .message-row { display: flex; gap: 10px; max-width: 85%; }
    .message-row.client { align-self: flex-start; }
    .message-row.public { align-self: flex-end; flex-direction: row-reverse; }
    .message-row.internal { align-self: stretch; max-width: 100%; }

    .message-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .avatar-client { background: #E2E8F0; color: #475569; }
    .avatar-public { background: var(--tp-green); color: #fff; }
    .avatar-internal { background: #F59E0B; color: #fff; }

    .message-bubble { border-radius: 8px; padding: 10px 14px; font-size: 12px; line-height: 1.5; box-shadow: var(--card-shadow); border: 1px solid var(--border); }
    
    .message-row.client .message-bubble { background: var(--bg-subtle); border-color: var(--border); }
    .message-row.public .message-bubble { background: var(--tp-green-light); border-color: var(--tp-green-border); color: var(--text-main); }
    
    /* Nota Interna Destacada */
    .message-row.internal .message-bubble { background: var(--note-bg); border-color: var(--note-border); color: var(--note-text); width: 100%; border-left: 4px solid #F59E0B; }

    .message-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 11px; gap: 10px; }
    .message-sender { font-weight: 700; }
    .message-time { color: var(--text-subtle); font-size: 10px; }

    /* Compositor de Mensagens / Notas */
    .composer-area { padding: 12px 18px; border-top: 1px solid var(--border); background: var(--bg-sidebar); display: flex; flex-direction: column; gap: 8px; }
    
    .composer-tabs { display: flex; justify-content: space-between; align-items: center; }
    .tab-toggles { display: flex; gap: 4px; background: var(--bg-subtle); padding: 3px; border-radius: 6px; }
    .toggle-btn { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 4px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; }
    .toggle-btn.active.public { background: var(--bg-surface); color: var(--tp-green); font-weight: 700; box-shadow: var(--card-shadow); }
    .toggle-btn.active.internal { background: #FEF3C7; color: #92400E; font-weight: 700; box-shadow: var(--card-shadow); }

    .macro-bar { display: flex; gap: 4px; align-items: center; }
    .macro-chip { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; background: var(--bg-subtle); border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; }
    .macro-chip:hover { border-color: var(--border-focus); color: var(--text-main); }

    .composer-input-row { display: flex; gap: 8px; align-items: flex-end; }
    .composer-textarea { flex: 1; resize: none; height: 64px; padding: 8px 12px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-main); outline: none; }
    .composer-textarea:focus { border-color: var(--border-focus); }
    .composer-textarea.internal-mode { background: var(--note-bg); border-color: var(--note-border); }

    .btn-send { height: 64px; padding: 0 16px; font-size: 12px; font-weight: 700; border-radius: 6px; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .btn-send.public { background: var(--tp-green); color: #fff; }
    .btn-send.public:hover { opacity: 0.9; }
    .btn-send.internal { background: #D97706; color: #fff; }
    .btn-send.internal:hover { opacity: 0.9; }
  </style>
</head>

    function App() {
      const [tickets, setTickets] = useState(INITIAL_TICKETS);
      const [selectedId, setSelectedId] = useState("TP-1042");

          document.body.classList.add("dark-theme");
        } else {
          document.body.classList.remove("dark-theme");
        }
        localStorage.setItem("tp_console_theme", theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(theme === "dark" ? "light" : "dark");

      // Ticket selecionado

      // Filtragem da Fila (Coluna 2)

        if (filterView === "mine" && t.operator !== "Leandro") return false;
        if (filterView === "urgent" && (!t.slaUrgent || t.status === "done")) return false;
        if (filterView === "open" && t.status !== "todo") return false;
        if (filterView === "process" && t.status !== "in_progress") return false;
        if (filterView === "done" && t.status !== "done") return false;
        if (filterView === "pedagio" && t.product !== "PEDÁGIO") return false;
        if (filterView === "abastecimento" && t.product !== "ABASTECIMENTO") return false;
        if (filterView === "manutencao" && t.product !== "MANUTENÇÃO") return false;

        // Busca
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const match = (t.id + " " + t.title + " " + t.client + " " + (t.dafRede || "") + " " + (t.solicitacao || "")).toLowerCase();
          if (!match.includes(q)) return false;
        }

        return true;
      });

      // Enviar mensagem ou nota interna
      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!composerText.trim()) return;

        const now = new Date();
        const d = String(now.getDate()).padStart(2, '0');
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const y = now.getFullYear();
        const h = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const timeFormatted = `${d}/${m}/${y} ${h}:${min}`;

        const newMessage = {
          id: Date.now(),
          type: composerType,
          sender: composerType === "internal" ? "Leandro Silveira (Nota Interna)" : "Leandro Silveira (Suporte TruckPag)",
          time: timeFormatted,
          text: composerType === "internal" ? `🔒 ${composerText.trim()}` : composerText.trim()
        };

        const updated = tickets.map(t => {
          if (t.id === activeTicket.id) {
            return {
              ...t,
              messages: [...t.messages, newMessage]
            };
          }
          return t;
        });

        setTickets(updated);
        setComposerText("");
      };

      // Alterar status
      const handleStatusChange = (newStatus) => {
        const updated = tickets.map(t => {
          if (t.id === activeTicket.id) {
            return {
              ...t,
              status: newStatus,
              slaCountdown: newStatus === "done" ? "Concluído" : t.slaCountdown,
              slaUrgent: newStatus === "done" ? false : t.slaUrgent
            };
          }
          return t;
        });
        setTickets(updated);
      };

      // Alterar operador
      const handleOperatorChange = (newOp) => {
        const updated = tickets.map(t => {
          if (t.id === activeTicket.id) {
            return { ...t, operator: newOp };
          }
          return t;
        });
        setTickets(updated);
      };

      // Inserir Macro
      const applyMacro = (macro) => {
        if (macro === "veiculo") {
          setComposerText(prev => prev + (prev ? "\n" : "") + "Para que possamos concluir o cadastro, informe: Placa, Marca/Modelo, Ano, Cor e Município.");
        } else if (macro === "usuario") {
          setComposerText(prev => prev + (prev ? "\n" : "") + "Para liberação de acesso na TruckPag, informe: Nome completo, CPF, E-mail corporativo e Contato.");
        } else if (macro === "estorno") {
          setComposerText(prev => prev + (prev ? "\n" : "") + "Como o lote do ciclo anterior já foi liquidado, o cancelamento entrará como crédito automático na fatura do ciclo subsequente.");
        }
      };

      return (
        <div className="app-container">
          
          {/* =================================================================
              COLUNA 1: SIDEBAR / FILAS & VISÕES
              ================================================================= */}
          <aside className="col-sidebar">
            <div>
              <div className="brand-box">
                <div className="brand-logo">TP</div>
                <div className="brand-info">
                  <h1>TruckPag</h1>
                  <p>Operations Console</p>
                </div>
              </div>

              <div className="nav-section-title">Filas de Atendimento</div>
              <div className="nav-list">
                <button className={`nav-btn ${filterView === 'all' ? 'active' : ''}`} onClick={() => setFilterView('all')}>
                  <span>📥 Todos os Tickets</span>
                  <span className="nav-badge">{tickets.length}</span>
                </button>
                <button className={`nav-btn ${filterView === 'mine' ? 'active' : ''}`} onClick={() => setFilterView('mine')}>
                  <span>👤 Meus Atendimentos</span>
                  <span className="nav-badge">{tickets.filter(t => t.operator === 'Leandro').length}</span>
                </button>
                <button className={`nav-btn ${filterView === 'urgent' ? 'active' : ''}`} onClick={() => setFilterView('urgent')}>
                  <span>🔥 SLA Crítico / Urgente</span>
                  <span className="nav-badge" style={{color:'#EF4444'}}>{tickets.filter(t => t.slaUrgent && t.status !== 'done').length}</span>
                </button>
                <button className={`nav-btn ${filterView === 'open' ? 'active' : ''}`} onClick={() => setFilterView('open')}>
                  <span>⚡ Em Aberto</span>
                  <span className="nav-badge">{tickets.filter(t => t.status === 'todo').length}</span>
                </button>
                <button className={`nav-btn ${filterView === 'process' ? 'active' : ''}`} onClick={() => setFilterView('process')}>
                  <span>⚙️ Em Processo</span>
                  <span className="nav-badge">{tickets.filter(t => t.status === 'in_progress').length}</span>
                </button>
                <button className={`nav-btn ${filterView === 'done' ? 'active' : ''}`} onClick={() => setFilterView('done')}>
                  <span>✅ Concluídos</span>
                  <span className="nav-badge">{tickets.filter(t => t.status === 'done').length}</span>
                </button>
              </div>

              <div className="nav-section-title">Por Unidade de Negócio</div>
              <div className="nav-list">
                <button className={`nav-btn ${filterView === 'pedagio' ? 'active' : ''}`} onClick={() => setFilterView('pedagio')}>
                  <span>🛣️ Pedágio</span>
                  <span className="nav-badge">{tickets.filter(t => t.product === 'PEDÁGIO').length}</span>
                </button>
                <button className={`nav-btn ${filterView === 'abastecimento' ? 'active' : ''}`} onClick={() => setFilterView('abastecimento')}>
                  <span>⛽ Abastecimento</span>
                  <span className="nav-badge">{tickets.filter(t => t.product === 'ABASTECIMENTO').length}</span>
                </button>
                <button className={`nav-btn ${filterView === 'manutencao' ? 'active' : ''}`} onClick={() => setFilterView('manutencao')}>
                  <span>🔧 Manutenção DAF</span>
                  <span className="nav-badge">{tickets.filter(t => t.product === 'MANUTENÇÃO').length}</span>
                </button>
              </div>
            </div>

            <div className="sidebar-footer">
              <div className="operator-profile">
                <div className="operator-avatar">L</div>
                <div>
                  <div className="operator-name">Leandro S.</div>
                  <div style={{fontSize:'10px', color:'var(--tp-green)', fontWeight:'700'}}>● Online</div>
                </div>
              </div>
              <button className="theme-toggle-btn" onClick={toggleTheme} title="Alternar Modo Escuro / Claro">
                {theme === 'dark' ? '☀️' : '🌙'}
              </button>
            </div>
          </aside>

          {/* =================================================================
              COLUNA 2: FILA DE TICKETS (ALTA DENSIDADE)
              ================================================================= */}
          <section className="col-tickets">
            <div className="tickets-header">
              <div className="tickets-search-wrap">
                <span className="search-icon">🔍</span>
                <input 
                  type="text" 
                  className="tickets-search-input" 
                  placeholder="Buscar cliente, Bitrix, DAF, ID..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                />
              </div>
              <div className="tickets-meta-bar">
                <span>Fila ({filteredTickets.length})</span>
                <span>Classificar: Recentes</span>
              </div>
            </div>

            <div className="tickets-scroll-list">
              {filteredTickets.map(t => {
                const isSelected = t.id === activeTicket.id;
                const isDone = t.status === "done";
                return (
                  <div 
                    key={t.id} 
                    className={`ticket-card ${isSelected ? 'selected' : ''}`}
                    onClick={() => setSelectedId(t.id)}
                  >
                    <div className="ticket-card-top">
                      <span className="ticket-id">#{t.id}</span>
                      <span className={`ticket-sla ${isDone ? 'sla-done' : (t.slaUrgent ? 'sla-urgent' : 'sla-normal')}`}>
                        {isDone ? '✓ Concluído' : `⏱️ ${t.slaCountdown}`}
                      </span>
                    </div>

                    <div className="ticket-title" title={t.title}>{t.title}</div>
                    <div className="ticket-client">🏢 {t.client}</div>

                    <div className="ticket-tags">
                      <span className="tag-pill">{t.product}</span>
                      <span className="tag-pill">{t.solicitacao}</span>
                      {t.dafRede && <span className="tag-pill tag-daf">🏢 {t.dafRede}</span>}
                      {t.bitrixLink && <span className="tag-pill tag-bitrix">🔗 Bitrix</span>}
                      <span style={{marginLeft:'auto', fontSize:'10px', color:'var(--text-subtle)'}}>👤 {t.operator}</span>
                    </div>
                  </div>
                );
              })}

              {filteredTickets.length === 0 && (
                <div style={{textAlign:'center', padding:'30px 10px', color:'var(--text-muted)'}}>
                  Nenhum ticket encontrado nesta fila.
                </div>
              )}
            </div>
          </section>

          {/* =================================================================
              COLUNA 3: DETALHES & LINHA DO TEMPO / CHAT INTERATIVO
              ================================================================= */}
          <main className="col-detail">
            {/* Topbar com ID, Ações de Status e Atribuição */}
            <div className="detail-topbar">
              <div className="detail-title-group">
                <h2>
                  <span style={{color:'var(--tp-green)', fontFamily:'monospace'}}>#{activeTicket.id}</span>
                  <span>{activeTicket.title}</span>
                </h2>
                <div className="detail-subtitle">
                  Aberto em: {activeTicket.startDate} • Cliente: {activeTicket.client}
                </div>
              </div>

              <div className="detail-actions">
                <select 
                  className="status-select"
                  value={activeTicket.status}
                  onChange={(e) => handleStatusChange(e.target.value)}
                >
                  <option value="todo">📥 Aberto</option>
                  <option value="in_progress">⚙️ Em processo</option>
                  <option value="done">✅ Concluído</option>
                </select>

                <select 
                  className="op-select"
                  value={activeTicket.operator}
                  onChange={(e) => handleOperatorChange(e.target.value)}
                >
                  <option value="Leandro">👤 Leandro</option>
                  <option value="Mirian">👤 Mirian</option>
                  <option value="Isabelli">👤 Isabelli</option>
                </select>
              </div>
            </div>

            {/* Strip de Metadados Horizontal */}
            <div className="metadata-strip">
              <div className="meta-item">📞 Contato: <strong>{activeTicket.contact}</strong></div>
              <div className="meta-item">🏷️ Produto: <strong>{activeTicket.product} ({activeTicket.solicitacao})</strong></div>
              {activeTicket.dafRede && (
                <div className="meta-item">🏢 Rede DAF: <strong>{activeTicket.dafRede} ({activeTicket.dafMunicipio})</strong></div>
              )}
              {activeTicket.bitrixLink && (
                <div className="meta-item">
                  <a href={activeTicket.bitrixLink} target="_blank" rel="noreferrer" style={{color:'#4F46E5', fontWeight:'700', textDecoration:'none'}}>
                    🔗 Abrir Card Bitrix ↗
                  </a>
                </div>
              )}
              <div className="meta-item">📅 Retorno Alvo: <strong>{activeTicket.returnDate}</strong></div>
            </div>

            {/* Linha do Tempo de Mensagens */}
            <div className="timeline-container">
              {activeTicket.messages.map(msg => (
                <div key={msg.id} className={`message-row ${msg.type}`}>
                  <div className={`message-avatar ${msg.type === 'client' ? 'avatar-client' : (msg.type === 'public' ? 'avatar-public' : 'avatar-internal')}`}>
                    {msg.type === 'client' ? 'C' : (msg.type === 'public' ? 'TP' : '🔒')}
                  </div>

                  <div className="message-bubble">
                    <div className="message-header">
                      <span className="message-sender">{msg.sender}</span>
                      <span className="message-time">{msg.time}</span>
                    </div>
                    <div>{msg.text}</div>
                  </div>
                </div>
              ))}
            </div>

            {/* Compositor Interativo (Resposta Pública vs Nota Interna) */}
            <form className="composer-area" onSubmit={handleSendMessage}>
              <div className="composer-tabs">
                <div className="tab-toggles">
                  <button 
                    type="button" 
                    className={`toggle-btn ${composerType === 'public' ? 'active public' : ''}`}
                    onClick={() => setComposerType('public')}
                  >
                    💬 Resposta Pública (Cliente)
                  </button>
                  <button 
                    type="button" 
                    className={`toggle-btn ${composerType === 'internal' ? 'active internal' : ''}`}
                    onClick={() => setComposerType('internal')}
                  >
                    🔒 Nota Interna (BackOffice)
                  </button>
                </div>

                <div className="macro-bar">
                  <span style={{fontSize:'10px', color:'var(--text-subtle)'}}>Macros Rápidas:</span>
                  <button type="button" className="macro-chip" onClick={() => applyMacro('veiculo')}>+ //veiculo</button>
                  <button type="button" className="macro-chip" onClick={() => applyMacro('usuario')}>+ //usuario</button>
                  <button type="button" className="macro-chip" onClick={() => applyMacro('estorno')}>+ //estorno_lote</button>
                </div>
              </div>

              <div className="composer-input-row">
                <textarea 
                  className={`composer-textarea ${composerType === 'internal' ? 'internal-mode' : ''}`}
                  placeholder={composerType === 'public' ? "Escreva uma resposta pública oficial para o cliente..." : "Escreva uma nota interna confidencial (visível apenas para a equipe de BackOffice)..."}
                  value={composerText}
                  onChange={(e) => setComposerText(e.target.value)}
                ></textarea>

                <button 
                  type="submit" 
                  className={`btn-send ${composerType === 'public' ? 'public' : 'internal'}`}
                >
                  <span>{composerType === 'public' ? 'Enviar' : 'Salvar'}</span>
                  <span style={{fontSize:'10px', fontWeight:'normal'}}>{composerType === 'public' ? 'Público' : 'Interno'}</span>
                </button>
              </div>
            </form>
          </main>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
